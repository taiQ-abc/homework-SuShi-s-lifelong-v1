      { title: '赠刘景文', text: '荷尽已无擎雨盖，菊残犹有傲霜枝。\n一年好景君须记，最是橙黄橘绿时。', note: '杭州任上赠友之作，勉励中见旷达。' }
    ]
  },
  {
    id: 'huizhou',
    name: '惠州',
    modern: '今广东惠州',
    coord: [114.41, 23.11],
    era: '贬谪 · 1094—1097年',
    story: '绍圣元年（1094年），新党再度得势，苏轼被贬惠州。此时他已年近六旬，却依然保持着乐观的天性。“日啖荔枝三百颗，不辞长作岭南人”便是他在惠州写下的名句。他在惠州还写了大量和陶诗，并留下《荔支叹》这样关怀民瘼的现实主义杰作[citation:2][citation:12]。',
    poems: [
      { title: '食荔支二首·其二', text: '罗浮山下四时春，卢橘杨梅次第新。\n日啖荔支三百颗，不辞长作岭南人。', note: '以食荔之乐写贬谪之地的安居，旷达至极。' },
      { title: '纵笔', text: '白头萧散满霜风，小阁藤床寄病容。\n报道先生春睡美，道人轻打五更钟。', note: '据说政敌章惇见“春睡美”句，怒而将其再贬儋州。' }
    ]
  },
  {
    id: 'danzhou',
    name: '儋州',
    modern: '今海南儋州',
    coord: [109.58, 19.52],
    era: '贬谪 · 1097—1100年',
    story: '绍圣四年（1097年），六十二岁的苏轼被再贬儋州（今海南）。在宋代，放逐海南是仅次于满门抄斩的惩罚。初到儋州时他“环视天水无际，凄然伤之”，但很快便随遇而安。他在儋州办学教书、劝导农耕、研究医药，与当地百姓结下深厚情谊。北归时他写下“九死南荒吾不恨，兹游奇绝冠平生”[citation:8][citation:15]。',
    poems: [
      { title: '六月二十日夜渡海', text: '参横斗转欲三更，苦雨终风也解晴。\n云散月明谁点缀，天容海色本澄清。\n空余鲁叟乘桴意，粗识轩辕奏乐声。\n九死南荒吾不恨，兹游奇绝冠平生。', note: '遇赦北归渡海之作，以“奇绝”总结贬谪生涯，气魄非凡。' },
      { title: '儋耳山', text: '突兀隘空虚，他山总不如。\n君看道旁石，尽是补天余。', note: '初到儋州时作，以补天石自喻，不平中见自负。' }
    ]
  },
  {
    id: 'changzhou',
    name: '常州',
    modern: '今江苏常州',
    coord: [119.95, 31.79],
    era: '终老 · 1101年',
    story: '元符三年（1100年），徽宗即位，大赦天下，苏轼得以北归。他一路北行，沿途百姓争相迎接。建中靖国元年（1101年）七月，苏轼病逝于常州，享年六十六岁。临终前，维琳方丈在他耳边大声说“端明宜忘西方”，苏轼微声答道：“西方不无，但个里着力不得。”一代文豪，就此谢幕。',
    poems: [
      { title: '自题金山画像', text: '心似已灰之木，身如不系之舟。\n问汝平生功业，黄州惠州儋州。', note: '北归途中自题画像，以三处贬所为平生功业，旷达中见沉痛。' }

const chart = echarts.init(document.getElementById('map'), null, { renderer: 'canvas' });
const MAP_URL = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';

fetch(MAP_URL)
  .then(res => res.json())
  .then(geoJson => { echarts.registerMap('china', geoJson); renderMap(); })
  .catch(() => {
    fetch('https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json')
      .then(r => r.json())
      .then(geoJson => { echarts.registerMap('china', geoJson); renderMap(); })
      .catch(() => {
        document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8a7f6e;font-size:14px;">地图数据加载失败，请检查网络后刷新</div>';
      });
  });

function renderMap() {
  const scatterData = locations.map(loc => ({ name: loc.name, value: [...loc.coord, 1], id: loc.id }));
  const lineCoords = locations.map(loc => loc.coord);

  const option = {
    backgroundColor: 'transparent',
    geo: {
      map: 'china', roam: true, zoom: 1.15, center: [108, 32],
      label: { show: false },
      itemStyle: {
        areaColor: 'rgba(224,213,192,.6)',
        borderColor: 'rgba(122,95,58,.5)',
        borderWidth: 0.8,
        shadowColor: 'rgba(42,38,32,.08)', shadowBlur: 8, shadowOffsetY: 2
      },
      emphasis: {
        itemStyle: { areaColor: 'rgba(168,135,90,.22)', borderColor: 'rgba(122,95,58,.85)', borderWidth: 1.2 }
      },
      select: { disabled: true }
    },
    series: [
      {
        type: 'lines', coordinateSystem: 'geo', zlevel: 2,
        effect: { show: true, period: 6, trailLength: 0.18, symbol: 'arrow', symbolSize: 4, color: 'rgba(156,53,40,.32)' },
        lineStyle: { color: 'rgba(156,53,40,.25)', width: 1.3, curveness: 0.2, type: 'dashed' },
        data: lineCoords.slice(0, -1).map((from, i) => ({ coords: [from, lineCoords[i + 1]] }))
      },
      {
        type: 'scatter', coordinateSystem: 'geo', zlevel: 3, symbol: 'circle', symbolSize: 15,
        itemStyle: {
          color: '#f3ead6', borderColor: '#9c3528', borderWidth: 2,
          shadowColor: 'rgba(156,53,40,.35)', shadowBlur: 8, shadowOffsetY: 2
        },
        emphasis: {
          scale: 1.6,
          itemStyle: { color: '#fdf8ec', borderColor: '#9c3528', borderWidth: 2.5, shadowBlur: 16, shadowColor: 'rgba(156,53,40,.55)' }
        },
        label: {
          show: true, formatter: '{b}', position: 'right', offset: [8, 0],
          color: '#2a2620', fontSize: 11.5, fontWeight: 600,
          fontFamily: '"STKaiti","KaiTi","Noto Serif SC",serif',
          textShadowColor: 'rgba(243,234,214,.95)', textShadowBlur: 5
        },
        data: scatterData
      }
    ]
  };

  chart.setOption(option);

  chart.on('click', function (params) {
    if (params.seriesType === 'scatter') {
      const loc = locations.find(l => l.name === params.name);
      if (loc) openLocation(loc.id);
    }
  });
}

const infoPanel = document.getElementById('infoPanel');
const panelInner = document.getElementById('panelInner');

function renderPoem(poem) {
  let html = `
    <div class="poem-title">${poem.title}</div>
    <div class="poem-text">${poem.text}</div>
    ${poem.note ? `<div class="poem-note">${poem.note}</div>` : ''}
  `;
  if (poem.background && poem.background.length > 0) {
    html += `<div class="bg-section"><div class="bg-title">创作背景</div>${poem.background.map(p => `<div class="bg-text">${p}</div>`).join('')}</div>`;
  }
  return `<div class="poem-card">${html}</div>`;
}

function openLocation(id) {
  const loc = locations.find(l => l.id === id);
  if (!loc) return;

  const poemsHtml = loc.poems.map(renderPoem).join('');

  panelInner.innerHTML = `
    <div class="panel-era">${loc.era}</div>
    <div class="panel-place">${loc.name}</div>
    <div class="panel-modern">${loc.modern}</div>
    <div class="panel-divider"></div>
    <div class="panel-story">${loc.story}</div>
    <div class="panel-divider"></div>
    ${poemsHtml}
  `;

  panelInner.scrollTop = 0;
  infoPanel.classList.add('show');
}

function closePanel() { infoPanel.classList.remove('show'); }
document.getElementById('panelClose').addEventListener('click', closePanel);
chart.getZr().on('click', function (e) { if (!e.target) closePanel(); });
window.addEventListener('resize', () => { chart.resize(); });
setTimeout(() => openLocation('huangzhou'), 1200);
</script>
</body>
